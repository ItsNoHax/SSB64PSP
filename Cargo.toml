[workspace]
resolver = "2"
members = [
    "crates/ssb-rom",
    "crates/ssb-engine",
    "crates/ssb-game",
    "crates/ssb-capture",
    "tools/romtool",
]

# The two PSP binaries -- `psp-asset-viewer/` (the debug/rendering-validation
# application) and `psp-game/` (F1's front end/Training Mode, a separate
# EBOOT) -- plus `psp-runtime/` (the shared PSP platform/rendering/runtime
# library both depend on) are deliberately NOT workspace members: all three
# target `mipsel-sony-psp`, are `no_std`, and are built with `cargo psp`
# (which needs nightly + `-Z build-std`). Keeping them out lets `cargo test`
# at the root run on stable for every host-side crate.
exclude = ["psp-asset-viewer", "psp-game", "psp-runtime"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# `slice::as_chunks` is used in the byte-parsing hot paths and stabilised here.
# Keep in step with RUST_STABLE in .github/workflows/ci.yml.
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ItsNoHax/SSB64PSP"

[workspace.dependencies]
# `default-features = false` must live here, not at the use site: a member
# crate cannot turn off a workspace dependency's default features (cargo warns
# and ignores it), and if `std` leaks in this way the PSP build fails with a
# confusing "can't find crate for `std`". Crates that want `std` opt in through
# their own `std` feature.
ssb-rom = { path = "crates/ssb-rom", default-features = false }
ssb-engine = { path = "crates/ssb-engine", default-features = false }
ssb-game = { path = "crates/ssb-game", default-features = false }
ssb-capture = { path = "crates/ssb-capture" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
