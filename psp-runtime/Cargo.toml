[package]
name = "ssb-psp-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Layer C: shared PSP platform/rendering/runtime library used by psp-asset-viewer and psp-game."

# Deliberately outside the root workspace, for the same reason as
# `psp-asset-viewer/` and `psp-game/`: this crate targets mipsel-sony-psp, is
# no_std, and is built with `cargo psp`. See the root Cargo.toml. It has no
# rust-toolchain.toml of its own: both applications pull it in as a path
# dependency, and the invoking application's own pinned nightly governs the
# whole build, including this crate.
[workspace]

[dependencies]
psp = { git = "https://github.com/ItsNoHax/rust-psp", rev = "3ecf457b787493e1ab3421365c9a7f9167238a8d", features = ["external-allocator"] }
ssb-engine = { path = "../crates/ssb-engine", default-features = false }
ssb-rom = { path = "../crates/ssb-rom", default-features = false }
ssb-game = { path = "../crates/ssb-game", default-features = false }

[features]
# Masks every FPU exception on the game's threads (`fpu.rs`) instead of
# keeping the enables the system starts them with. Off by default.
fpu_mask = []
# Replaces the game with the FCR31 launch probe (`fcr31_probe.rs`, RE-516):
# PSPLink ldstart, then an XMB-style LoadExec of a probe EBOOT, then back to
# PSPLink. Needs ARK. Off by default.
fcr31_probe = []
# Frame timing and free-memory reports (`profile.rs`, RE-469). Off by
# default: the spans compile to nothing.
profile = ["ssb-engine/audio_profile"]
# Adds the PSP's hardware counters (cycles, stalls, cache misses) to every
# span through ARK's KUBridge (`hwcount.rs`, RE-481). Needs ARK on the PSP;
# not for PPSSPP.
profile_hw = ["profile"]
# One clock read per frame and a `prof n=` line of frames per second every
# 120 frames (`frame_timer.rs`, RE-500): times the release build's code,
# which `profile`'s spans change. Off by default.
frame_timer = []
# Renders the fixed audio scenario (`ssb_engine::audio::golden`) at audio
# start and appends its PCM hashes and render times to `selftest.log`.
audio_selftest = []
# Runs `ssb_engine::math::sqrt` over `ssb_engine::math::sqrt_golden`'s
# inputs at boot and appends its result and output hash to `selftest.log`
# (`sqrt_selftest.rs`). Off by default.
sqrt_selftest = []
# Runs the original's sine, cosine and inverse trigonometry and the FPU's
# f32 divide/multiply/add over `ssb_engine::math::trig_golden`'s inputs at
# boot, times a sine and cosine call, and appends the result to
# `selftest.log` (`trig_selftest.rs`). Off by default.
trig_selftest = []
# Copies every submitted audio block into a ring the game thread writes to
# `audio.raw` beside the executable (`audio::dump_flush`): s16le stereo at
# 32000 Hz. Off by default.
audio_dump = []
# Splits the GE's texel traffic by draw category and texture
# (`texprobe.rs`, RE-490): `texoff.txt` switches texturing off, and a
# census of the bound textures goes to `texprobe.log`. Off by default.
texture_probe = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = true

[profile.dev]
opt-level = 1
