[package]
name = "ssb64-psp-game"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Layer C: the SSB64PSP game -- the front end and Training Mode players actually run, a separate EBOOT from the debug asset viewer in `psp-asset-viewer/`."

# Deliberately outside the root workspace, for the same reason as
# `psp-asset-viewer/`: this crate targets mipsel-sony-psp, is no_std, and is
# built with `cargo psp`. See the root Cargo.toml.
[workspace]

[dependencies]
psp = { git = "https://github.com/ItsNoHax/rust-psp", rev = "a89142b237f3014fc15425d3549e44d3aa07d1c6" }
ssb-engine = { path = "../crates/ssb-engine", default-features = false }
ssb-rom = { path = "../crates/ssb-rom", default-features = false }
ssb-game = { path = "../crates/ssb-game", default-features = false }
ssb-psp-runtime = { path = "../psp-runtime" }
ssb-capture = { path = "../crates/ssb-capture" }

[features]
# Boot and scene-load lines to `ms0:/PSP/GAME/ssb64/boot.log`
# (`src/boot_log.rs`, RE-475), for XMB launches where PSPLink is not
# running. Allocates nothing. Off by default.
boot_log = []
# Holds the memory that leaves `ballast.txt`'s byte count free at boot, so a
# PPSSPP or PSPLink run sees an XMB launch's smaller budget
# (`ssb_psp_runtime::memory::hold_ballast`, RE-475). Off by default.
memory_ballast = []
# Frame timing, free-memory and stack reports every 120 frames to
# `profile.log` beside the executable and to stdout
# (`ssb_psp_runtime::profile`, RE-469). Off by default.
profile = ["ssb-psp-runtime/profile"]
# Renders the fixed audio scenario (`ssb_engine::audio::golden`) at audio
# start and appends its PCM hashes and render times to `selftest.log`.
audio_selftest = ["ssb-psp-runtime/audio_selftest"]
# Copies the audio thread's output into a ring written to `audio.raw`
# beside the EBOOT (s16le stereo, 32000 Hz), for exact comparisons:
# PPSSPPHeadless cannot record audio (`ssb_psp_runtime::audio`).
audio_dump = ["ssb-psp-runtime/audio_dump"]
# Boots without the audio system (no thread, every sound call a no-op), for
# A/B profiling against the default build.
no_audio = []
# Writes each finished frame's pixel hash to stdout (`fhash` lines), for
# frame-by-frame A/B runs of two builds under PPSSPPHeadless (RE-476).
frame_hash = []
# One EBOOT for every scripted Training scene: the scene is read at startup
# from `capture_scene.txt` beside the EBOOT (`src/capture.rs`), and the
# program exits a few frames after its screenshot. The per-scene features
# below still work; each now only names a default scene.
golden_capture = ["capture_scene_file", "headless_capture"]
# Reads `capture_scene.txt` like `golden_capture`, without the screenshot
# request or the exit: the physical-PSP build of a golden scene
# (`tools/stage-psp-regression.sh --golden NAME`).
capture_scene_file = ["regression_capture"]

# Replaces real `sceCtrl` input with a fixed, tick-indexed button script
# (`scripted_buttons` in `main.rs`) so the Intro -> Menu -> Training state
# machine can be driven deterministically under PPSSPPHeadless, with no real
# controller and no windowed PPSSPP/X11 input injection. Off by default: an
# interactive build must read the real pad. Named to match
# `psp-asset-viewer/`'s `regression_capture` feature for tooling symmetry
# (`tools/run-ppsspp-headless.sh --crate psp-game`); the two features are
# otherwise unrelated (`psp-asset-viewer/`'s freezes render state, this one
# scripts input).
regression_capture = []
# Strict rendering mode: refuse a pack with any texture, palette, mesh,
# node-transform or costume reference the draw path would skip
# (`ssb_rom::strict`). Training then shows `BG_TRAINING_STRICT_FAILED`.
strict_render = []
# Extends the scripted Training capture with a neutral-B input after the
# existing jump/jab sequence, keeping the default capture's established
# composition while providing a focused Fireball integration smoke.
regression_capture_fireball = ["regression_capture"]
# Extends the scripted Training capture with B+up after the established
# jump/jab sequence, exercising Mario's Super Jump Punch against the live
# dummy through the regular Training hit bridge.
regression_capture_superjump = ["regression_capture"]
# Selects Fox in Training and fires one grounded Blaster shot, exercising
# Fox's status, animation, weapon spawn, packed direct mesh, and draw path.
regression_capture_fox = ["regression_capture"]
# Captures Training at the first jump's apex: player airborne above Dream
# Land while the stationary dummy remains grounded.  This is the deterministic
# fighter-shadow regression scene.
regression_capture_shadows = ["regression_capture"]
# Requests one framebuffer capture from PPSSPPHeadless after the scripted
# input above reaches its frozen tick. The devctl is ignored by real PSPs.
headless_capture = []
# Logs each random draw's call site per frame in the How to Play trace.
rng_trace = ["ssb-game/rng_trace"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# No debug info in the shipped EBOOT (RE-475: 31 MB with it, 4 MB
# without). The code is the same either way, so a build with
# `CARGO_PROFILE_RELEASE_DEBUG=true` maps a shipped EBOOT's addresses with
# `psp-addr2line` (the psp-hardware skill).
debug = false

[profile.dev]
opt-level = 1
