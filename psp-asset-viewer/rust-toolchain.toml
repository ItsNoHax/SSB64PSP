# The SSB64PSP fork of rust-psp tracks upstream's PanicPayload compatibility
# fix and cargo-psp now requires this nightly or newer. Pin it so release
# builds remain reproducible. Any future bump still needs a PPSSPP boot check,
# not merely a successful compile.
#
# Keep this synchronized with psp-game/rust-toolchain.toml and
# .github/workflows/ci.yml's PSP_NIGHTLY value.
[toolchain]
channel = "nightly-2026-08-26"
components = ["rust-src"]
targets = []
