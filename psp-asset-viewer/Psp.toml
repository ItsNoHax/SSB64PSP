title = "Super Smash Bros. 64"

# RE-255: the real asset pack (~25.6MiB) exceeds the ~20-24MiB default user
# partition. MEMSIZE=1 requests full memory access (64MB total RAM instead
# of 32MB) on PSP-2000/3000 (Slim/Brite) hardware -- ignored on PSP-1000
# (Fat). Standard PSP homebrew SDK PARAM.SFO key.
memsize = 1

# XMB presentation (docs/xmb-assets.md). ICON1.PMF is generated from
# ICON1_source.mp4 by tools/make-pmf.py, SND0.AT3 by tools/make-snd0-loop.py
# and tools/encode-snd0.sh; both are committed.
xmb_icon_png = "xmb/ICON0.PNG"
xmb_icon_pmf = "xmb/ICON1.PMF"
xmb_background_overlay_png = "xmb/PIC0.PNG"
xmb_background_png = "xmb/PIC1.PNG"
# The viewer shares the game's music.
xmb_music_at3 = "../psp-game/xmb/SND0.AT3"
