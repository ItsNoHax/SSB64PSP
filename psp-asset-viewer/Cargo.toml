[package]
name = "ssb64-psp-asset-viewer"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Layer C: the PSP debug/rendering-validation asset viewer for the SSB64 port."

# Deliberately outside the root workspace: this crate targets mipsel-sony-psp,
# is no_std, and is built with `cargo psp`. See the root Cargo.toml.
[workspace]

[dependencies]
psp = { git = "https://github.com/ItsNoHax/rust-psp", rev = "a89142b237f3014fc15425d3549e44d3aa07d1c6" }
ssb-engine = { path = "../crates/ssb-engine", default-features = false }
ssb-rom = { path = "../crates/ssb-rom", default-features = false }
ssb-game = { path = "../crates/ssb-game", default-features = false }
ssb-psp-runtime = { path = "../psp-runtime" }

[features]
# Freezes every per-frame mutation (physics, skeleton/stage/material
# animation) once `regression::TARGET_TICKS` simulation ticks have run, so a
# screenshot taken any time after that point is byte-identical regardless of
# how long the capture script actually waited (R0.17). Off by default: the
# debug viewer is normally driven interactively for minutes at a time, and
# freezing it would break that.
regression_capture = []

# R1's second deterministic scene (`docs/visual-regression.md`'s test
# matrix): boots straight into the object viewer on file 52's `mvopeningroom`
# graph (RE-198's CI8 and untextured/vertex-coloured examples both live in
# it), disables the default Dream Land stage view, freezes at the same fixed
# tick as `regression_capture`, and suppresses viewer diagnostics the same
# way. Off by default.
regression_capture_scene2 = []

# R1 test-matrix scene for texture blending, translucency, and clean clamp:
# Stage Sector's file 109 graph at 0x44C8. Same deterministic object-viewer
# freeze and diagnostic suppression as scene 2. Off by default.
regression_capture_scene3 = []

# R1 test-matrix scene for flat constant colour: EFCommonEffects2's file 84
# graph at 0x2760. Same deterministic object-viewer freeze and diagnostic
# suppression as scenes 2 and 3. Off by default.
regression_capture_scene4 = []

# R2's "stage animation works" scene: boots the default whole-stage viewer
# (unlike scenes 2-4, this stays in stage_view, not the object viewer) on
# stage 9, Saffron City (file 112), whose gate RE-142/RE-143 already proved
# moves under joint animation -- a real, already-verified translation/
# rotation, not a rest-pose object. Same deterministic freeze at tick 240 as
# `regression_capture`. Off by default.
regression_capture_scene5 = []

# R2 broader-coverage capture: the first golden scene to put a fighter other
# than Mario's own skeleton on screen. Selects Fox's own file-313 graph at
# 0x2938 (RE-152's exact identification -- the graph whose head primitive
# 4/texture 551 previously rendered a solid black clamp-window bug, fixed by
# preserving the render tile's uls/ult origin). RE-264 applies Sector Z's
# source fighter light to pin Fox's white gloves/boots and the PSP light-0
# enable. Same deterministic object-viewer freeze and diagnostic suppression
# as scenes 2-4. Off by default.
regression_capture_fox = ["fighter_regression_capture"]

# R2 broader-coverage scene: the second non-Mario fighter golden. Selects
# Captain Falcon's own file-332 graph at 0x3BE0 -- one of the three fighters
# (with Fox and Kirby) RE-102 measured a real UV-scale/clamp bug on. Same
# deterministic object-viewer freeze and diagnostic suppression as the earlier
# viewer captures. Off by default.
regression_capture_captain_falcon = ["fighter_regression_capture"]

# R2 broader-coverage scene: the third non-Mario fighter golden. Selects
# Kirby's own file-328 graph at 0x1448 -- the third of the three fighters
# (with Fox and Captain Falcon) RE-102 measured a real UV-scale/clamp bug
# on. Same deterministic object-viewer freeze and diagnostic suppression as
# the other fighter captures. Off by default.
regression_capture_kirby = ["fighter_regression_capture"]

# R2 broader-coverage scene: the fourth non-Mario fighter golden. Selects
# Ness's own file-335 graph at 0x26B0. RE-103 named Ness, alongside Fox,
# Captain Falcon and Kirby, as a fighter whose surface "melted" into
# rainbow noise under the old per-primitive majority-vote lit-vs-literal
# heuristic -- a different bug class than the earlier fighters' UV-scale/clamp
# fix.
# RE-264 also pins the bounded neutral-face reconstruction correction shared
# with Kirby. Same deterministic object-viewer freeze and diagnostic
# suppression as scenes 2-4 and 6-8. Off by default.
regression_capture_ness = ["fighter_regression_capture"]

# R2 broader-coverage scene: the fifth non-Mario fighter golden. Selects
# Donkey Kong's own file-317 graph at 0x39A8 -- the lower-offset of the
# file's symmetric 26-node graph pair, matching the convention used by the
# earlier fighter captures. Same deterministic object-viewer freeze and
# diagnostic suppression as the other fighter captures. Off by default.
regression_capture_donkey_kong = ["fighter_regression_capture"]

# R2.2/C6 broader-coverage scene (RE-257): Link, explicitly named in
# `PLAN.md`'s C6 recheck list alongside Mario/Fox/Kirby/Ness/Captain Falcon
# but never given a golden. Selects the lower-offset of file 324's symmetric
# 32-node graph pair (0x3AE8 vs 0x74B0), matching the other fighter captures'
# convention
# for picking between a fighter's two `common_parts` skeleton graphs. Same
# deterministic object-viewer freeze and diagnostic suppression as the other
# fighter captures, plus Dream Land's source-derived fighter-light context so
# Link's material-light-tinted tunic is not reduced to the generic viewer's
# gray fallback (RE-261). Off by default.
regression_capture_link = ["fighter_regression_capture"]
# RE-301: exercises a real non-zero costume through the same packed
# colour/light/palette override path as normal object-view selection.
regression_capture_link_costume_1 = ["regression_capture_link"]

# Every playable fighter has a deterministic neutral-model regression scene.
# The original game supplies a stage-directional light immediately before
# `ftDisplayMainProcDisplay`; these captures do the same, rather than showing
# a lightless object-browser approximation.  Individual features are kept
# separate so each image is a stable, independently comparable golden.
fighter_regression_capture = []
regression_capture_mario = ["fighter_regression_capture"]
regression_capture_samus = ["fighter_regression_capture"]
regression_capture_luigi = ["fighter_regression_capture"]
regression_capture_yoshi = ["fighter_regression_capture"]
regression_capture_pikachu = ["fighter_regression_capture"]
regression_capture_purin = ["fighter_regression_capture"]
# RE-311: Metal Mario (kind 13), the high-detail FTCommonPart graph at file
# 300 0x1E08. The only fighter golden whose body draws `G_TEXTURE_GEN`, and so
# the only one that shows the real-normal texgen filter compensation of its
# 48x42 body texture (file 300 0x2490).
regression_capture_metal_mario = ["fighter_regression_capture"]

# Fidelity probe: StageMetalFile2's first two-node graph (file 117, graph
# 0x1B10). Exercises real ordinary `G_TEXTURE_GEN` material state without item
# gameplay. Despite RE-214's original description, this graph's primitives
# (3530-3534, 3547-3550) are all ordinary texgen -- the archive's one
# `G_TEXTURE_GEN_LINEAR` primitive (3542) lives in a sibling graph, exercised
# by scene 8 instead (see that scene's own comment).
regression_capture_scene6 = []

# The same StageMetalFile2 graph as scene 6, frozen a quarter turn further
# round (RE-214). One frozen reflection cannot distinguish a correct texgen
# basis from a stuck or constant one; a second deterministic capture of the
# same geometry under the same camera at a known different rotation can.
regression_capture_scene7 = []

# StageMetalFile2's *second* two-node graph (file 117, graph 0x2EE0) -- the
# only graph in the archive whose pack content actually carries
# `G_TEXTURE_GEN_LINEAR` (prim 3542, tex 499, 12 triangles). Scenes 6/7
# target 0x1B10, which despite an earlier RE-214 note turned out to be
# ordinary texgen only (found while implementing the exact `acos` curve:
# scene 6's golden was unchanged by the new code, which a reachability probe
# traced to this). Off by default.
regression_capture_scene8 = []

# R2.1/T9 camera-rotation case: the same ordinary-texgen graph as scenes
# 6/7 (file 117, graph 0x1B10), but framed with a real, non-identity view
# matrix (35 degrees yaw, 20 degrees pitch around the object) instead of the
# object viewer's usual identity-view/push-the-object-back trick, mirroring
# `stage_view`'s own real-camera branch (RE-131/RE-214) so `texgen_basis` is
# a genuine camera right/up rather than world X/Y. Scenes 6/7 already prove
# response to *object* rotation under a fixed camera; this proves response to
# *camera* rotation under a fixed object, the case T3 (RE-227) named as
# dormant (no scene fed a non-identity basis into `quantize_lookat_basis`).
# Off by default.
regression_capture_scene9 = []

# R2 stage-coverage scene: Peach's Castle (stage 4, file 259,
# `259_GRCastleMap.c`) -- a real VS-mode battle stage, distinct from the 26
# single-fighter bonus maps and the tutorial/test maps that make up most of
# the archive's 41-stage block. Two animated joint layers give this a
# second, independent stage-animation data point beside Saffron City's gate
# (scene 5). Same deterministic whole-stage freeze as scene 5. Off by
# default.
regression_capture_scene10 = []

# R2 stage-coverage sweep: parametrized stage golden, stage index supplied at
# compile time via the `SSB64_STAGE_INDEX` environment variable
# (`option_env!`), rather than a dedicated Cargo feature per stage. Scenes 5
# and 10 already prove the one-feature-per-stage pattern for two stages; the
# archive's 41-stage block has 37 more entries (5 more real VS-mode battle
# stages, Mushroom Kingdom, Beta Dream Land, the Test Stage, Duel Zone, Small
# Yoshi's Island, the tutorial map, the Metal Mario stage, and 25 bonus maps),
# and adding 37 near-identical named features would bloat this file for no
# benefit a build-time parameter doesn't already give. Same deterministic
# whole-stage freeze as scenes 5/10 (stays in `stage_view`, not the object
# viewer). Off by default; `SSB64_STAGE_INDEX` defaults to 0 (Dream Land) if
# unset while this feature is enabled.
regression_capture_stage_index = []

# `R2.2`/C3 measurement rig (RE-251): a synthetic, non-ROM diagnostic proving
# `apply_material`'s `sceGuDepthMask` wiring, the same `texgen_normal_
# diagnostic_*` shape as `normal_diag.rs` (one purpose-built scene replacing
# the whole frame, not a stage/object pick). Draws three quads: an opaque far
# quad (depth-test on, write on), a translucent near quad overlapping it
# (depth-test on, write OFF), then a third opaque quad at a depth between the
# two, drawn last (depth-test on, write on again) -- proving the ON->OFF->ON
# switch and that a depth-test/no-write translucent front surface does not
# block a later opaque draw the way a write-enabled one would. Off by
# default.
depth_mask_diagnostic = []

# R2.1/T2 measurement rig (RE-226): replaces the whole scene with one
# full-screen quad whose vertices share a single hand-picked `GU_NORMAL_8BIT`
# value, drawn through `sceGuTexProjMapMode` with a synthetic 256x256 ramp
# texture (`R = generated s texel`, `G = generated t texel`) so the captured
# screenshot's top-left pixel *is* the GE's own computed texture-matrix
# source vector, back-solvable exactly. Each feature selects one (normal,
# projection mode) case; exactly one may be enabled at a time. Cases 0/2 use
# the previously-shipped `NormalizedNormal` mode as a control -- RE-226 needs
# to show *that* mode collapsing [64,0,0] and [127,0,0] to the same output
# before the `Normal` (raw, unnormalized) cases can be trusted as the fix.
# Off by default; never combined with a real scene.
texgen_normal_diagnostic_0 = [] # [127,0,0], NormalizedNormal (control)
texgen_normal_diagnostic_1 = [] # [127,0,0], Normal (raw)
texgen_normal_diagnostic_2 = [] # [64,0,0],  NormalizedNormal (control)
texgen_normal_diagnostic_3 = [] # [64,0,0],  Normal (raw)
texgen_normal_diagnostic_4 = [] # [-128,0,0], Normal (raw)
texgen_normal_diagnostic_5 = [] # [90,90,0], Normal (raw)
texgen_normal_diagnostic_6 = [] # [73,-41,99], Normal (raw)

# R2/RE-278 measurement rig: does real GE hardware sampling match
# `n64_addressing`'s reference model (already checked host-side, RE-277) for
# RE-272/274's exact mirror+clamp wide-overscan axis? Draws a synthetic
# 64-texel triangle-wave texture at fixed, non-interpolated probe coordinates
# (`addr_diag::PROBES`) under both `Nearest` and `Linear` filtering, in one
# frame, replacing the whole scene the same way `depth_mask_diagnostic`/
# `texgen_normal_diagnostic_*` do. Off by default.
addr_diag_probe = []

# R2/RE-280 measurement rig: RE-278's own named remainder, both at once. Draws
# two real screen-space triangle quads (`GuPrimitive::Triangles`, matching
# `draw_mesh`'s real topology, not `addr_diag_probe`'s degenerate sprites)
# whose corners carry genuinely different `u` values spanning RE-274's own
# `-31..90` texel range, so interior columns are real GE-interpolated
# coordinates, through the actual `Ci4`/CLUT paletted bind path
# (`sceGuClutMode`/`sceGuClutLoad`/`PsmT4`) `bind_texture` uses for the real
# primitive, which `addr_diag_probe`'s plain `Psm8888` texture did not
# exercise. Off by default.
tri_addr_diag_probe = []

# Synthetic 2D texture-sampling alignment rig (RE-304).  Samples a unique-
# colour 4x4 texture at N64 S10.5 boundary/centre coordinates under point and
# filtered GE modes, with and without the candidate half-texel correction.
texture_sampling_diag = []

# Requests one framebuffer capture from PPSSPPHeadless after the deterministic
# scene has reached its frozen tick. The devctl is ignored by real PSPs, so it
# is safe to combine with any regression scene and has no effect on normal
# interactive or hardware builds.
headless_capture = []

# Boots Dream Land through the real battle camera, freezes at the same fixed
# tick as the regression scene, and suppresses viewer diagnostics (R0.14).
camera_audit_capture = []

# The interactive viewer's on-screen HUD (position, status, timing, controls
# legend). Built on `sceGuDebugPrint`/`sceGuDebugFlush`, which RE-202 found
# reliably crashes real PSP hardware with an unaligned instruction-fetch
# fault a few seconds into any build that calls it every frame -- content-
# independent (a one-word overlay reproduces it as fast as the full HUD) and
# invisible under PPSSPP, which does not enforce the same alignment. Off by
# default so a plain `cargo psp --release` -- what a developer runs to flash
# real hardware -- boots safely; `tools/run-ppsspp.sh`'s default (non-audit)
# build passes this on so the interactive PPSSPP workflow keeps its HUD.
debug_overlay = []

# Boots directly into R0.12's isolated billboard browser. This removes the
# host-specific PPSSPP key mapping needed to enter the audit, while retaining
# the normal D-pad navigation and on-screen source identity. Off by default.
billboard_audit_capture = []

# Boots directly into the fighter figatree browser with animation zero
# already playing. The PPSSPP harness advances the normal D-pad control and
# captures every packed fighter motion in stable table order (R1). Stage and
# results animations use the separate AObjEvent32 runtime paths and are not
# decoded by this mode.
animation_audit_capture = []

# Boots directly into the source-backed manager-effect object inventory. The
# PPSSPP harness advances the normal D-pad control and captures all 46 unique
# display-bearing EFDesc assets in source order (R1/RE-173).
effect_audit_capture = []

# RE-312 residual deployment: deterministic frame of Mario's original entry
# pipe effect (file 356 graph 0x608), which uses a selected dense variant.
# This remains a renderer-validation scene in the asset viewer.
regression_capture_mario_entry = ["effect_audit_capture"]

# RE-312's largest phase gain: the original bonus-stage small platform,
# whose mesh includes the file-136 residual use site.
regression_capture_bonus_platform = []

# Captures frame 4 of each of the 35 manager effects with a source-declared
# DObj AObjEvent32 transform animation (R1/RE-174).
effect_animation_audit_capture = []

# Captures frame 4 of each of the 26 manager effects with a source-declared
# per-primitive AObjEvent32 material animation (R1/RE-176), restarting and
# ticking EffectMaterialAnimator and rendering through PrimDesc.mat_anim's
# texture-swap consumption in meshdraw.rs.
effect_material_audit_capture = []

# Boots directly into the RE-183 LBParticle render proof-of-concept: spawns
# the selected packed script fresh, ticks it to frame 4, and draws the
# resulting billboard through meshdraw::draw_particle. The normal D-pad
# still browses every packed script (R1/RE-183).
particle_render_audit_capture = []

# Automatically enters the first original results wipe after four seconds.
# Used to validate that the captured pixels come from the completed battle
# frame before the overlay begins. Off by default.
transition_audit_capture = []

# Boots directly into the RE-189 real manager-effect spawn-event
# proof-of-concept: creates a real `LBGenerator` from `efManagerRippleMakeEffect`'s
# own `efcommon` script (`0x61`) at a live nonzero position, ticks it and its
# one spawned particle every real frame, and draws the particle at its
# current live position through meshdraw::draw_particle -- unlike
# `particle_render_audit_capture`'s single frame-4 snapshot at `(0,0,0)`
# (R1/RE-189).
effect_spawn_audit_capture = []

# Automatically requests the RE-191 wallpaper-capture snapshot at tick 240,
# then blits it into the corner of every later frame via
# `Gpu::blit_wallpaper_debug`. Proves the capture holds real pixel data;
# there is still no real render-path caller (no 1P-mode/results-screen game
# state, no packed asset to bind it to). Off by default.
wallpaper_audit_capture = []

# Same tick-240 capture trigger as `wallpaper_audit_capture`, but displays it
# through `Gpu::draw_wallpaper_sprite` -- a real GE 2D sprite draw (texture
# bind, `GU_TRANSFORM_2D`, prim-colour modulate), not a raw CPU blit. Proves
# RE-193's minimal `SObj` sprite port renders the capture correctly through
# the actual GE texture pipeline, distinct evidence from
# `wallpaper_audit_capture`'s own CPU-blit proof. Off by default.
wallpaper_sprite_audit_capture = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Debug symbols cost nothing at runtime and make psplink/psp-gdb usable.
debug = true

[profile.dev]
opt-level = 1
