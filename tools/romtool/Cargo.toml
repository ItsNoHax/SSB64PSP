[package]
name = "romtool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Validates a user-supplied SSB64 ROM and extracts assets for the PSP build."

[dependencies]
ssb-rom = { workspace = true, features = ["std"] }
# So the collision query can be exercised against the real stages rather than
# only against fixtures -- the same "converter as validator" arrangement that
# checked the display-list decoder (RE-017).
ssb-game = { workspace = true, features = ["std"] }
ssb-engine = { workspace = true, features = ["std"] }
# `pack` writes the TABLES section and installs it before packing (the
# packer reads `ssb_engine::math`'s sines); any other command reading a
# table builds it from the ROM (`host-rom`).
ssb-tables = { workspace = true, features = ["host-rom"] }
ssb-tablegen = { workspace = true }
# The pack build itself; `pack` is a wrapper: options, file output, summary.
ssb-pack = { workspace = true, features = ["std"] }

[build-dependencies]
# Only for the `ssb64_stub_tables` cfg (`build.rs`).
ssb-tablegen = { workspace = true }

[dev-dependencies]
# `ssb_tablegen::test_rom` finds the ROM for the ROM-backed tests.
ssb-tablegen = { workspace = true }
