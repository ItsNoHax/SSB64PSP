[package]
name = "ssb-rom"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reads Super Smash Bros. 64 ROM data: validation, VPK0, relocData archive, N64 asset formats."

[dependencies]
sha1_smol = { version = "1.0", default-features = false }
libm = "0.2"
# `lbCommonSin` for the collision matrices (`Mat4::from_trs_collision`).
ssb-engine = { workspace = true }

[build-dependencies]
# Writes the tables read from the user's ROM into OUT_DIR (`build.rs`).
ssb-tablegen = { workspace = true }

[features]
default = ["std"]
std = []

[dev-dependencies]
# Tests that touch the real ROM are gated behind the SSB64_ROM env var so the
# suite still passes in CI, where no ROM is available.
# `tests/stage_controllers.rs` drives the portable stage controllers with
# the ROM's own stage-object animations. `ssb-game` does not depend on this
# crate, so there is no cycle.
ssb-game = { workspace = true, features = ["std"] }
ssb-engine = { workspace = true, features = ["std"] }
# `fighter`'s test checks the generator's FTAttributes offsets.
ssb-tablegen = { workspace = true }
