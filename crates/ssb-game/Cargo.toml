[package]
name = "ssb-game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Layer A: portable Smash 64 game logic, free of platform dependencies."

[dependencies]
ssb-engine = { workspace = true }
# The ROM-derived `d*` arrays and records, from the pack's TABLES section.
ssb-tables = { workspace = true }

[build-dependencies]
# Writes the tables read from the user's ROM into OUT_DIR (`build.rs`).
ssb-tablegen = { workspace = true }

[features]
default = ["std"]
std = ["ssb-engine/std"]
# Records each random draw's call site (`rng::trace`), for traces.
rng_trace = []

[dev-dependencies]
# The tables read before any `install` (`ssb_engine::math`'s sines): built
# from the ROM (`host-rom`).
ssb-tables = { workspace = true, features = ["host-rom"] }
