[package]
name = "ssb-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Platform-agnostic engine abstractions (Layer B) for the SSB64 PSP port."

[dependencies]
# `gSYSinTable` and `dLBCommonSinLookup`, from the pack's TABLES section
# (`math`).
ssb-tables = { workspace = true }

[build-dependencies]
# Only for the `ssb64_stub_tables` cfg (`build.rs`).
ssb-tablegen = { workspace = true }

# `math::sqrt_exact` on `no_std` targets other than the PSP (CI's
# portability build): the PSP uses `sqrt.s`, the host `std`.
[target.'cfg(not(target_arch = "mips"))'.dependencies]
libm = "0.2"

[features]
default = ["std"]
std = []
# Per-stage render timing (`audio::prof`) for platform profiling.
audio_profile = []

[dev-dependencies]
# The audio tests build the pack's audio section from the user's ROM
# (`SSB64_ROM`); without it they skip.
ssb-rom = { workspace = true }
# `ssb_tablegen::test_rom` finds the ROM.
ssb-tablegen = { workspace = true }
# The tables read before any `install`: built from the ROM (`host-rom`).
ssb-tables = { workspace = true, features = ["host-rom"] }
