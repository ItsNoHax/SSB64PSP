[package]
name = "ssb-tablegen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reads the ROM-derived tables into the pack's TABLES section; writes their layout at build time."

# - `tables_section`: the user's ROM -> the pack's `TABLES` section
#   (`romtool pack`, `ssb-pack` on the PSP, `ssb-tables`' `host-rom`).
# - Build-dependency of `ssb-game` and `ssb-rom`: `build_script` writes their
#   tables' layout (no ROM data, no ROM read) into Cargo's OUT_DIR. Nothing it
#   produces is written into the source tree or committed.

[dependencies]
sha1_smol = { version = "1.0", default-features = false }
# `interp`'s square root without `std` (`math::sqrt_exact`).
libm = "0.2"

[[bin]]
name = "ssb-tablegen"
path = "src/bin/ssb-tablegen.rs"
required-features = ["std"]

[features]
# `ssb-rom`'s error type, compiled in here (`src/lib.rs`), gates its
# `std::error::Error` impl on this feature. Without it only the `TABLES`
# section reader builds, `no_std` (`ssb-pack` on the PSP).
default = ["std"]
std = []
