[package]
name = "ssb64-psp"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Layer C: the PSP backend and executable for the SSB64 port."

# Deliberately outside the root workspace: this crate targets mipsel-sony-psp,
# is no_std, and is built with `cargo psp`. See the root Cargo.toml.
[workspace]

[dependencies]
psp = "0.3.13"
ssb-engine = { path = "../crates/ssb-engine", default-features = false }
ssb-rom = { path = "../crates/ssb-rom", default-features = false }
ssb-game = { path = "../crates/ssb-game", default-features = false }

[features]
# Freezes every per-frame mutation (physics, skeleton/stage/material
# animation) once `regression::TARGET_TICKS` simulation ticks have run, so a
# screenshot taken any time after that point is byte-identical regardless of
# how long the capture script actually waited (R0.17). Off by default: the
# debug viewer is normally driven interactively for minutes at a time, and
# freezing it would break that.
regression_capture = []

# Boots Dream Land through the real battle camera, freezes at the same fixed
# tick as the regression scene, and suppresses viewer diagnostics (R0.14).
camera_audit_capture = []

# Boots directly into R0.12's isolated billboard browser. This removes the
# host-specific PPSSPP key mapping needed to enter the audit, while retaining
# the normal D-pad navigation and on-screen source identity. Off by default.
billboard_audit_capture = []

# Boots directly into the fighter figatree browser with animation zero
# already playing. The PPSSPP harness advances the normal D-pad control and
# captures every packed fighter motion in stable table order (R1). Stage and
# results animations use the separate AObjEvent32 runtime paths and are not
# decoded by this mode.
animation_audit_capture = []

# Boots directly into the source-backed manager-effect object inventory. The
# PPSSPP harness advances the normal D-pad control and captures all 46 unique
# display-bearing EFDesc assets in source order (R1/RE-173).
effect_audit_capture = []

# Automatically enters the first original results wipe after four seconds.
# Used to validate that the captured pixels come from the completed battle
# frame before the overlay begins. Off by default.
transition_audit_capture = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Debug symbols cost nothing at runtime and make psplink/psp-gdb usable.
debug = true

[profile.dev]
opt-level = 1
